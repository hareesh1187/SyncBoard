services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - syncboard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  app-a:
    build: .
    environment:
      PORT: 3000
      INSTANCE_ID: app-a
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy

  app-b:
    build: .
    environment:
      PORT: 3000
      INSTANCE_ID: app-b
      REDIS_URL: redis://redis:6379
      PUBLIC_ORIGIN: http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-a
      - app-b

volumes:
  syncboard-redis:
